[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "quant-free-mcp"
version = "0.2.0"
description = "Public read-only crypto market-data MCP reference server"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]
[project.optional-dependencies]
quant = ["numpy>=1.26,<3", "pandas>=2.1,<3"]
test = ["numpy>=1.26,<3", "pandas>=2.1,<3", "pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["quant_free_mcp*", "research_lab*"]
