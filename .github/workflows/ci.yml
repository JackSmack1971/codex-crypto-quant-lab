# Offline qualification. No step contacts a market-data provider; provider behaviour is covered by
# deterministic injected transports/clocks (tests/test_acquisition.py). Live probes live in
# live-providers.yml and are manual/opt-in only.
name: offline-ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stdlib:
    name: stdlib suites (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Structural and package-manifest validation
        run: python scripts/verify_control_plane.py
      - name: Syntax and import checks
        run: |
          python -m compileall -q quant_free_mcp research_lab scripts src tests
          python -c "import quant_free_mcp.core, quant_free_mcp.acquisition, quant_free_mcp.adapters, quant_free_mcp.math, research_lab.completion, research_lab.mission_integrity, research_lab.provider_policy, research_lab.archive, research_lab.mission_spec, research_lab.mission_coordinator, research_lab.experiment_registry, research_lab.reporting, research_lab.charts, research_lab.history, research_lab.benchmarks, research_lab.benchmark_mutations"
      - name: Dependency declaration check
        run: python scripts/check_dependencies.py
      - name: Core, reporting, research, mission-integrity and provider fault-injection tests
        run: |
          set -e
          for t in test_core test_reporting test_control_plane_validator test_mission_completion test_mission_integrity \
                   test_acquisition test_research_lab test_research_expansion test_research_workflows \
                   test_research_v24 test_research_explorer_v24 test_p0_regressions \
                   test_mission_coordinator test_mission_recovery test_experiment_registry test_mission_e2e \
                   test_report_composition test_charts test_history test_benchmarks test_corrective_repair test_qualification_hardening; do
            python -m unittest "tests.$t" -v
          done
          python scripts/benchmark.py --repeat 2

  full:
    name: full suite with pinned direct dependencies (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-ci.txt
      - name: Install pinned direct dependencies (project is run from the checkout; no build artifacts)
        run: python -m pip install -c constraints-ci.txt mcp numpy pandas pytest
      - name: Dependency consistency
        run: |
          python -m pip check
          python scripts/check_dependencies.py --installed
      - name: Fixture mission bundle integrity (archive-less fixture: PARTIALLY_VERIFIED is expected; archive-backed exit 0 is gated in test_mission_e2e)
        run: python scripts/verify_mission.py tests/fixtures/synthetic-mission-bundle --allow-partial
      - name: pytest (live provider tests are skipped unless QUANT_LIVE_TESTS=1)
        run: python -m pytest tests -q
